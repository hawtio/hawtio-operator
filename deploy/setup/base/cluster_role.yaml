apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hawtio-operator-cluster-role
rules:

#
# --- CORE RESOURCES (High Privilege) ---
#

# Required for direct administration of hawtio-online resources
- apiGroups: [""]
  resources: ["configmaps", "serviceaccounts", "services"]
  verbs: ["create", "get", "list", "patch", "update", "watch"]

# Required for broadcasting events to the event logs
- apiGroups: ["", "events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch", "update"]

#
# --- APPS (High Privilege) ---
#

# Required for direct administration of the hawtio-online deployments
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "patch", "update", "watch"]

#
# --- READ-ONLY METADATA ---
#

# Required for operator leader election
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["get"]

# Required for operator being able to read
# the Hawtio CR schema (CRD)
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]

#
# --- HAWTIO CUSTOM RESOURCE ---
#

# Required to read, write, delete the
# Hawtio Custom Resources
- apiGroups: ["hawt.io"]
  resources: ["*"]
  verbs: ["*"]
