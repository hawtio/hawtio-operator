apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: hawtio-operator-webhook-config
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: mutate.hawtio.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    clientConfig:
      service:
        name: hawtio-operator-webhook-service
        # Needs to match the namespace of the operator install
        namespace: placeholder
        path: "/hawtio-guard"
    rules:
      - apiGroups: ["hawt.io"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE"]
        resources: ["hawtios"]
        scope: "Namespaced"
